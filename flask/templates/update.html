<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Update Criminal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69..."
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container my-5">
      <h3>Update Details for {{ criminal.name }}</h3>
      <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label">Current Photo</label><br />
          <img
            src="{{ url_for('static', filename=upload_subfolder + '/' + criminal.image_file) }}"
            width="120"
            class="img-thumbnail"
          />
        </div>
        <div class="mb-3">
          <label class="form-label">Replace Photo</label>
          <input type="file" name="image_file" class="form-control" />
        </div>
        <!-- other fields pre-filled -->
        <button type="submit" class="btn btn-success">Save Changes</button>
      </form>
    </div>
  </body>
</html>
